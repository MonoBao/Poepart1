name: Java tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install --yes ant ant-optional
      - run: ant -noinput clean test jar
